name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4G 2>&1 | tee build.log && exit 0

      - name: Report compile errors to the step summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build failed"
            echo '```'
            grep -E "error:|warning:|What went wrong|Execution failed|Caused by|> Task .*FAILED|FAILURE:" build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: warmod-jar
          path: build/libs/*.jar
          if-no-files-found: warn
