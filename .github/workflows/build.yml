name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4G 2>&1 | tee build.log && exit 0

      - name: API probe (javap on the mapped Minecraft jar)
        if: failure()
        shell: bash
        run: |
          set +e
          JAR=""
          for candidate in $(find "$HOME/.gradle/caches" -name "*.jar" ! -name "*sources*" 2>/dev/null); do
            if unzip -l "$candidate" 2>/dev/null | grep -q "net/minecraft/client/renderer/DimensionSpecialEffects.class"; then
              JAR="$candidate"
              break
            fi
          done
          echo "jar: $JAR" > probe.log
          if [ -n "$JAR" ] && [ -f tools/probe.txt ]; then
            while IFS='|' read -r cls pattern; do
              [ -z "$cls" ] && continue
              echo "=== $cls" >> probe.log
              javap -p -classpath "$JAR" "$cls" 2>&1 | grep -E "$pattern" | head -40 >> probe.log
            done < tools/probe.txt
          fi

      - name: Publish compile errors (issue comment)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build log excerpt"
            echo '```'
            grep -nE "error:|What went wrong|Execution failed|Caused by:|FAILURE:" build.log | head -80
            echo '```'
            echo "<details><summary>tail</summary>"
            echo '```'
            tail -120 build.log
            echo '```'
            echo "</details>"
            echo "### API probe"
            echo '```'
            head -c 30000 probe.log 2>/dev/null
            echo '```'
          } > err.md
          NUM=$(gh issue list --state open --search "CI build log in:title" --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file err.md
          else
            gh issue create --title "CI build log" --body-file err.md
          fi

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: warmod-jar
          path: build/libs/*.jar
          if-no-files-found: warn
