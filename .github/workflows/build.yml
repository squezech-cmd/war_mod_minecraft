name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4G 2>&1 | tee build.log && exit 0

      - name: Publish compile errors (issue comment)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build log excerpt"
            echo '```'
            grep -nE "error:|What went wrong|Execution failed|Caused by:|FAILURE:" build.log | head -80
            echo '```'
            echo "<details><summary>tail</summary>"
            echo '```'
            tail -120 build.log
            echo '```'
            echo "</details>"
          } > err.md
          NUM=$(gh issue list --state open --search "CI build log in:title" --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file err.md
          else
            gh issue create --title "CI build log" --body-file err.md
          fi

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: warmod-jar
          path: build/libs/*.jar
          if-no-files-found: warn
