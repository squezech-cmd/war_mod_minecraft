name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  issues: write

env:
  RELEASE_TAG: warmod-v1.0.0
  JAR_NAME: warmod-1.0.0-mc1.20.1.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4G 2>&1 | tee build.log

      - name: API probe (javap on the mapped Minecraft jar)
        if: failure()
        shell: bash
        run: |
          set +e
          JAR=""
          for candidate in $(find "$HOME/.gradle/caches" -name "*.jar" ! -name "*sources*" 2>/dev/null); do
            if unzip -l "$candidate" 2>/dev/null | grep -q "net/minecraft/client/renderer/DimensionSpecialEffects.class"; then
              JAR="$candidate"
              break
            fi
          done
          echo "jar: $JAR" > probe.log
          if [ -n "$JAR" ] && [ -f tools/probe.txt ]; then
            while IFS='|' read -r cls pattern; do
              [ -z "$cls" ] && continue
              echo "=== $cls" >> probe.log
              javap -p -classpath "$JAR" "$cls" 2>&1 | grep -E "$pattern" | head -40 >> probe.log
            done < tools/probe.txt
          fi

      - name: Publish compile errors (issue comment)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build log excerpt"
            echo '```'
            grep -nE "error:|What went wrong|Execution failed|Caused by:|FAILURE:" build.log | head -60
            echo '```'
            echo "### API probe"
            echo '```'
            head -c 25000 probe.log 2>/dev/null
            echo '```'
          } > err.md
          NUM=$(gh issue list --state open --search "CI build log in:title" --json number -q '.[0].number')
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file err.md; else gh issue create --title "CI build log" --body-file err.md; fi

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: warmod-jar
          path: build/libs/warmod-*.jar
          if-no-files-found: warn

      - name: Publish GitHub release with the jar
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/arena/a44f1106-war-mod-minecraft'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/warmod-*.jar | grep -v -- '-sources' | head -1)
          cp "$JAR" "$JAR_NAME"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "War Mod 1.0.0 — Forge 1.20.1" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" "$JAR_NAME" --clobber

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Start dedicated server in the background
        shell: bash
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nmax-tick-time=-1\nenable-rcon=true\nrcon.port=25575\nrcon.password=warmod\nspawn-protection=0\n' > run/server.properties
          nohup ./gradlew runServer --no-daemon -Dorg.gradle.jvmargs=-Xmx4G > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for the server to finish starting
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if grep -q "Done (" server.log 2>/dev/null; then
              echo "server up after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "server did not start"
          tail -60 server.log
          exit 1

      - name: RCON runtime checks (dimension, entities, vehicles)
        shell: bash
        run: |
          set -o pipefail
          python3 tools/smoke_rcon.py | tee rcon.md

      - name: Stop the server
        if: always()
        shell: bash
        run: |
          pkill -f "net.minecraft.server" || true
          pkill -f "GradleWrapperMain" || true
          sleep 3

      - name: Publish smoke test result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OK=no
          grep -q "Done (" server.log && OK=yes
          DIM=no
          grep -q "Preparing start region for dimension warmod:battlefield" server.log && DIM=yes
          {
            echo "### Dedicated server smoke test"
            echo "started: $OK, battlefield dimension seen: $DIM"
            echo '```'
            grep -nE "Done \(|Preparing start region|ERROR|Exception|Caused by|Failed to|crash|WARN.*warmod" server.log | head -60
            echo '```'
            echo "### RCON runtime checks"
            cat rcon.md 2>/dev/null || echo "no rcon output"
          } > smoke.md
          NUM=$(gh issue list --state open --search "CI smoke test in:title" --json number -q '.[0].number')
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file smoke.md; else gh issue create --title "CI smoke test" --body-file smoke.md; fi
          if [ "$OK" != "yes" ]; then exit 1; fi
          if grep -q "at com.warmod\." server.log; then
            echo "mod stacktrace found in the server log"
            grep -n -A20 "at com.warmod\." server.log | head -60
            exit 1
          fi
